<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazel</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="bar">
  <div class="brand"><img class="logo" src="/static/bazelgeuse.webp" alt="" width="500" height="500"> BAZEL</div>
  <div class="stats" id="stats">carregando…</div>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
  <button class="btn" id="refresh" title="recarrega a lista do GitHub">recarregar</button>
  <button class="btn ghost" id="show-config" title="ver a configuração">config</button>
</header>

<div id="banner" class="banner" hidden></div>

<main>
  <aside class="pane prs">
    <div class="pane-head">
      <input id="filter" type="search" placeholder="filtrar por título, repo ou autor…" autocomplete="off">
      <div class="row">
        <div class="segmented" id="scope">
          <button data-scope="all" class="on">todos</button>
          <button data-scope="mine">só meus</button>
        </div>
        <label class="check tiny"><input type="checkbox" id="hide-drafts"> esconder drafts</label>
      </div>
    </div>
    <div id="pr-list" class="list"><p class="empty">carregando PRs…</p></div>
    <div class="pane-foot">
      <label class="check"><input type="checkbox" id="select-all"> marcar todos</label>
      <div class="spacer"></div>
      <select id="agent" title="qual agente roda sobre os PRs marcados"></select>
      <button class="btn primary" id="review" disabled>revisar</button>
    </div>
  </aside>

  <section class="pane main">
    <div class="tabs">
      <button class="tab on" data-tab="queue">fila <span class="pill" id="queue-count">0</span></button>
      <button class="tab" data-tab="saved">salvos</button>
      <div class="spacer"></div>
      <div class="conn" id="conn" title="stream de eventos">●</div>
    </div>
    <div id="rail" class="rail"></div>
    <article id="viewer" class="viewer">
      <div class="placeholder">
        <img class="logo big" src="/static/bazelgeuse.webp" alt="" width="500" height="500">
        <p>Marque um PR à esquerda, escolha o agente e clique em <b>revisar</b>.</p>
        <p class="dim">O agente clona o repositório, roda sobre o PR e o resultado aparece aqui.
        Pode fechar a aba: o review continua no servidor.</p>
      </div>
    </article>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><b id="modal-title">configuração</b><button class="btn ghost" id="modal-close">fechar</button></div>
    <div class="modal-body">
      <h3>repositórios monitorados</h3>
      <div id="repo-list" class="repo-list"></div>
      <form class="row" id="repo-form">
        <input type="text" id="repo-input" placeholder="owner/repo" autocomplete="off">
        <button class="btn primary" type="submit">adicionar</button>
      </form>

      <h3>agentes</h3>
      <div id="agent-list" class="agent-list"></div>

      <h3>skills instaladas <span class="dim" id="skills-dir"></span></h3>
      <div id="skill-list" class="skill-list"></div>

      <h3 id="config-path"></h3>
      <pre id="config-yaml"></pre>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
